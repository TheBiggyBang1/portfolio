# Render Blueprint: deploys the site as a static site (free, served from a CDN,
# no server to sleep). In Render: New > Blueprint > pick this repo.
services:
  - type: web
    runtime: static
    name: mehdi-handous
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    # Link previews use the site's onrender.com URL. With a custom domain, add a
    # SITE_URL environment variable (e.g. https://example.com) in the dashboard.
    # The French site is dist/fr/index.html; /fr without the slash opens it too.
    routes:
      - type: rewrite
        source: /fr
        destination: /fr/index.html
    headers:
      # Hashed build files never change, so browsers can keep them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The 3D logo and gallery images keep their names when replaced: cache for a day.
      - path: /logo.glb
        name: Cache-Control
        value: public, max-age=86400
      - path: /gallery/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
